<!--my-profile.html-->

<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hồ sơ cá nhân</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>
<!-- Header -->
<div th:replace="fragments/header :: headerFragment"></div>

<!-- Nội dung -->
<div class="container mt-4">
    <h3>Hồ sơ cá nhân</h3>
    <div class="card">
        <div class="card-body">
            <p><strong>Họ tên:</strong> <span th:text="${session.currentUser.displayName}">Tên</span></p>
            <p><strong>Email:</strong> <span th:text="${session.currentUser.email}">Email</span></p>
            <p><strong>Số điện thoại:</strong> <span th:text="${session.currentUser.phone}">Phone</span></p>
            <p><strong>Vai trò:</strong> <span th:text="${session.currentUser.role}">ROLE</span></p>
        </div>
    </div>
</div>

<!-- ✅ Thiếu dòng này nên dropdown không hoạt động -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
