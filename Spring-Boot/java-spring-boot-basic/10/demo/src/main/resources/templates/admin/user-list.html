<!DOCTYPE html>
<!--admin/user-list.html-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý người dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">👤 Danh sách người dùng</h2>
    </div>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Họ tên</th>
            <th>Email</th>
            <th>Vai trò</th>
            <th>Ngày tạo</th>
            <th>Hành động</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user : ${users}">
            <td th:text="${user.id}">1</td>
            <td th:text="${user.username ?: 'Không có tên'}"></td>
            <td th:text="${user.email}">user@example.com</td>
            <td th:text="${user.role}">ADMIN</td>
            <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy')}">01/01/2024</td>
            <td>
                <a th:href="@{'/admin/users/edit/' + ${user.id}}" class="btn btn-sm btn-warning">Sửa</a>
                <form th:action="@{'/admin/users/delete/' + ${user.id}}" method="post" class="d-inline"
                      onsubmit="return confirm('Bạn có chắc muốn xóa người dùng này?');">
                    <input type="hidden" name="_method" value="delete"/>
                    <button class="btn btn-sm btn-danger">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
