<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: headerFragment}"></div>

<!-- PHIM HOT -->
<section class="py-4">
    <div class="container">
        <h4 class="mb-3">Phim HOT</h4>
        <div class="row">
            <div class="col-md-3 mb-4" th:each="movie : ${phimHot}">
                <div th:replace="~{movie :: movieItem(movie=${movie})}"></div>
            </div>
        </div>
    </div>
</section>

<!-- PHIM LẺ -->
<section class="py-4 bg-body-tertiary">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Phim lẻ mới cập nhật</h4>
            <a href="/phim-le">Xem thêm</a>
        </div>
        <div class="row">
            <div class="col-md-2 mb-4" th:each="movie : ${phimLe}">
                <div th:replace="~{movie :: movieItem(movie=${movie})}"></div>
            </div>
        </div>
    </div>
</section>

<!-- PHIM BỘ -->
<section class="py-4">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Phim bộ mới cập nhật</h4>
            <a href="/phim-bo">Xem thêm</a>
        </div>
        <div class="row">
            <div class="col-md-2 mb-4" th:each="movie : ${phimBo}">
                <div th:replace="~{movie :: movieItem(movie=${movie})}"></div>
            </div>
        </div>
    </div>
</section>

<!-- PHIM CHIẾU RẠP -->
<section class="py-4 bg-body-tertiary">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4>Phim chiếu rạp mới cập nhật</h4>
            <a href="/phim-chieu-rap">Xem thêm</a>
        </div>
        <div class="row">
            <div class="col-md-2 mb-4" th:each="movie : ${phimChieuRap}">
                <div th:replace="~{movie :: movieItem(movie=${movie})}"></div>
            </div>
        </div>
    </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
