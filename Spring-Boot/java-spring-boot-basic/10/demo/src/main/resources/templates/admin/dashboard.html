<!DOCTYPE html>
<!--admin/dashboard.html-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang quản trị</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container py-5">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary">Chào mừng đến trang quản trị</h2>
        <p class="text-muted">Vui lòng chọn một mục bên dưới để bắt đầu quản lý hệ thống.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-4">
            <a th:href="@{/admin/movies}" class="text-decoration-none">
                <div class="card shadow-sm mb-3 border-0 hover-shadow">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-semibold">🎬 Quản lý phim</h5>
                        <p class="text-muted small">Thêm, sửa, xóa các bộ phim.</p>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/admin/episodes}" class="text-decoration-none">
                <div class="card shadow-sm mb-3 border-0 hover-shadow">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-semibold">📺 Quản lý tập phim</h5>
                        <p class="text-muted small">Cập nhật các tập phim theo từng bộ phim.</p>
                    </div>
                </div>
            </a>
        </div>
        <div class="col-md-4">
            <a th:href="@{/admin/users}" class="text-decoration-none">
                <div class="card shadow-sm mb-3 border-0 hover-shadow">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-semibold">👤 Quản lý người dùng</h5>
                        <p class="text-muted small">Xem và chỉnh sửa thông tin người dùng.</p>
                    </div>
                </div>
            </a>
        </div>
    </div>
</div>

<!-- Optional: Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
