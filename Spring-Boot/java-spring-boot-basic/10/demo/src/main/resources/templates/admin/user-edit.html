<!DOCTYPE html>
<!--admin/user-edit.html-->
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa người dùng</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container py-5">
    <h2>Chỉnh sửa người dùng</h2>

    <form th:action="@{'/admin/users/edit/' + ${user.id}}" method="post">
        <div class="mb-3">
            <label class="form-label">Tên người dùng</label>
            <input type="text" name="name" class="form-control" th:value="${user.name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" th:value="${user.email}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Vai trò</label>
            <select name="role" class="form-select" required>
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == user.role}"></option>
            </select>
        </div>

        <div class="d-flex justify-content-between">
            <a class="btn btn-secondary" href="/admin/users">Quay lại</a>
            <button type="submit" class="btn btn-primary">Cập nhật</button>
        </div>
    </form>
</div>
</body>
</html>
