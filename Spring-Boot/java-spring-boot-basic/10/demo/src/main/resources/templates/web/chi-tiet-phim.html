<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${movie.name}">Chi tiết phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<!-- Header -->
<div th:replace="~{fragments/header :: headerFragment}"></div>

<section class="py-4">
    <div class="container">

        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item" th:if="${movie.type.name() == 'PHIM_BO'}">
                    <a th:href="@{/phim-bo}">Phim bộ</a>
                </li>
                <li class="breadcrumb-item" th:if="${movie.type.name() == 'PHIM_LE'}">
                    <a th:href="@{/phim-le}">Phim lẻ</a>
                </li>
                <li class="breadcrumb-item" th:if="${movie.type.name() == 'PHIM_CHIEU_RAP'}">
                    <a th:href="@{/phim-chieu-rap}">Phim chiếu rạp</a>
                </li>
                <li class="breadcrumb-item active" th:text="${movie.name}"></li>
            </ol>
        </nav>

        <!-- Chi tiết phim -->
        <div class="row">
            <div class="col-md-4">
                <a href="#" data-bs-toggle="modal" data-bs-target="#trailerModal">
                    <img class="img-fluid rounded" th:src="${movie.thumbnail}" th:alt="${movie.name}">
                </a>
            </div>
            <div class="col-md-8">
                <h4 th:text="${movie.name}">Tên phim</h4>
                <p><strong>Đánh giá:</strong> <span th:text="${movie.rating} + ' ⭐️'">5 ⭐️</span></p>
                <div class="bg-body-tertiary p-3 rounded">
                    <p><strong>Thể loại:</strong> <span th:text="${movie.type}"></span></p>
                    <p><strong>Năm phát hành:</strong> <span th:text="${movie.releaseYear}"></span></p>
                    <p><strong>Mô tả:</strong> <span th:text="${movie.description}"></span></p>
                </div>
                <div class="mt-3 d-flex gap-2">
                    <a class="btn btn-danger" th:href="@{'/xem-phim/' + ${movie.id} + '/1'}">Xem phim</a>
                    <button th:if="${session.currentUser != null}" class="btn btn-warning"
                            th:onclick="'addFavorite(' + ${movie.id} + ')'">
                        Yêu thích
                    </button>
                </div>
            </div>
        </div>

        <!-- Tập phim -->
        <div class="mt-4" th:if="${movie.type.name() == 'PHIM_BO'}">
            <h5>Tập phim</h5>
            <div class="d-flex flex-wrap gap-2">
                <a th:each="ep : ${episodes}"
                   class="btn btn-dark"
                   th:href="@{'/xem-phim/' + ${movie.id} + '/' + ${ep.displayOrder}}"
                   th:text="'Tập ' + ${ep.displayOrder}">Tập</a>
            </div>
        </div>

        <!-- Phim liên quan -->
        <div class="mt-5">
            <h5>Phim liên quan</h5>
            <div class="row">
                <div class="col-2" th:each="related : ${relatedMovies}">
                    <a th:href="@{'/phim/' + ${related.id} + '/' + ${related.slug}}">
                        <img class="img-fluid rounded" th:src="${related.thumbnail}" th:alt="${related.name}">
                        <p th:text="${related.name}" class="mt-2 mb-0"></p>
                    </a>
                </div>
            </div>
        </div>

        <!-- Phim yêu thích -->
        <div class="mt-5" th:if="${favorites != null && !favorites.isEmpty()}">
            <h5>Phim bạn đã yêu thích</h5>
            <div class="row">
                <div class="col-2" th:each="fav : ${favorites}">
                    <a th:href="@{'/phim/' + ${fav.movie.id} + '/' + ${fav.movie.slug}}">
                        <img class="img-fluid rounded" th:src="${fav.movie.thumbnail}" th:alt="${fav.movie.name}">
                        <p class="mt-2 mb-0" th:text="${fav.movie.name}"></p>
                    </a>
                </div>
            </div>
        </div>

        <!-- Bình luận -->
        <div class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <h5>Bình luận</h5>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modal-review"
                        th:if="${session.currentUser != null}">Viết bình luận</button>
            </div>
            <div class="review-list">
                <div class="review-item border p-3 mb-3" th:each="review : ${reviewsPage.content}">
                    <p th:text="${review.content}">Nội dung</p>
                    <p><strong>⭐️</strong> <span th:text="${review.rating}">5</span></p>
                    <div th:if="${session.currentUser?.id == review.user.id}">
                        <button class="btn btn-sm btn-primary" data-bs-toggle="modal"
                                data-bs-target="#updateReviewModal"
                                th:attr="data-review-id=${review.id},
                                         data-review-content=${review.content},
                                         data-review-rating=${review.rating}">
                            Cập nhật
                        </button>
                        <form th:action="@{/api/reviews/{id}(id=${review.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Bạn có chắc muốn xóa?');">
                            <input type="hidden" name="_method" value="delete"/>
                            <button class="btn btn-sm btn-danger" type="submit">Xóa</button>
                        </form>
                    </div>
                </div>
            </div>
            <nav class="mt-4" aria-label="Review pagination" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">

                    <!-- Nút Previous -->
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{'/phim/' + ${movie.id} + '/' + ${movie.slug} + '?page=' + (${currentPage} - 1)}"
                           aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <!-- Các trang -->
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(1, totalPages)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                           th:href="@{'/phim/' + ${movie.id} + '/' + ${movie.slug} + '?page=' + ${i}}"
                           th:text="${i}">1</a>
                    </li>

                    <!-- Nút Next -->
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link"
                           th:href="@{|/phim/${movie.id}/${movie.slug}?page=${currentPage + 1}|}"
                           aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>

                </ul>
            </nav>


        </div>

    </div>
</section>

<!-- Trailer Modal -->
<div class="modal fade" id="trailerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-body">
                <div class="ratio ratio-16x9">
                    <iframe th:src="${movie.trailer}" title="Trailer" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal tạo review -->
<div class="modal fade" id="modal-review" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form id="review-form" class="modal-content" method="post" th:action="@{/api/reviews}">
            <div class="modal-header">
                <h5 class="modal-title">Viết bình luận</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" name="movieId" th:value="${movie.id}"/>
                <div class="mb-3">
                    <label>Đánh giá (sao)</label>
                    <input class="form-control" type="number" name="rating" min="1" max="10" required>
                </div>
                <div class="mb-3">
                    <label>Nội dung</label>
                    <textarea class="form-control" name="content" rows="3" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" type="submit">Gửi</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal update review -->
<div class="modal fade" id="updateReviewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <form id="updateReviewForm" class="modal-content" th:action="@{/api/reviews/0}" method="post">
            <input type="hidden" name="_method" value="put"/>
            <input type="hidden" name="id" id="reviewId">
            <div class="modal-header">
                <h5 class="modal-title">Cập nhật bình luận</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label>Đánh giá</label>
                    <input class="form-control" type="number" name="rating" id="rating" min="1" max="10" required>
                </div>
                <div class="mb-3">
                    <label>Nội dung</label>
                    <textarea class="form-control" name="content" id="content" rows="3" required></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" type="submit">Cập nhật</button>
            </div>
        </form>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script th:inline="javascript">
    let movie = [[${movie}]];
</script>
<script th:src="@{/js/movie-detail.js}"></script>
</body>
</html>
