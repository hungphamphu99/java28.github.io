<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý phim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container py-4">
    <h2 class="mb-4 text-primary fw-bold">🎬 Danh sách phim</h2>

    <table class="table table-bordered table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Tên phim</th>
            <th>Thể loại</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="movie : ${moviePage.content}">
            <td th:text="${movie.id}">1</td>
            <td th:text="${movie.name}">Tên phim</td>
            <td th:text="${movie.type}">PHIM_BO</td>
            <td>
                <span th:text="${movie.status ? 'Hiển thị' : 'Ẩn'}">Hiển thị</span>
            </td>
            <td>
                <a th:href="@{'/admin/movies/edit/' + ${movie.id}}" class="btn btn-sm btn-warning">Sửa</a>
                <form th:action="@{'/admin/movies/delete/' + ${movie.id}}" method="post" class="d-inline"
                      onsubmit="return confirm('Bạn có chắc chắn muốn xóa?');">
                    <input type="hidden" name="_method" value="delete"/>
                    <button class="btn btn-sm btn-danger" type="submit">Xóa</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav th:if="${moviePage.totalPages > 1}" class="mt-4" aria-label="Phân trang">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/movies(page=${currentPage - 1})}">&laquo;</a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(1, moviePage.totalPages)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/admin/movies(page=${i})}" th:text="${i}">1</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == moviePage.totalPages} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/movies(page=${currentPage + 1})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
